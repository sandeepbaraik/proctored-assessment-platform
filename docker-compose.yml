services:
  mongo:
    image: mongo:7
    container_name: proctored-assessment-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: proctored-assessment-backend
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/proctored_assessment
      JWT_SECRET: local-development-secret-change-me
      JWT_EXPIRES_IN: 1d
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: proctored-assessment-frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:
